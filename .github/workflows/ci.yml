name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: standing
          POSTGRES_PASSWORD: standing
          POSTGRES_DB: standing
        ports: ["5441:5432"]
        options: >-
          --health-cmd "pg_isready -U standing" --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://standing:standing@localhost:5441/postgres
      TEST_REDIS_URL: redis://localhost:6380/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p standing build

  e2e:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: docker compose -p standing up --build -d --wait
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        run: docker compose -p standing logs --no-color | tail -300
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, if-no-files-found: ignore }
