name: standing
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: standing
      POSTGRES_PASSWORD: standing
      POSTGRES_DB: standing
    ports: ["127.0.0.1:5441:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standing"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
